version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: shipordie-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: shipordie
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: shipordie-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  chromadb:
    image: chromadb/chroma:latest
    container_name: shipordie-chromadb
    ports:
      - "8002:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    restart: always

volumes:
  postgres_data:
  redis_data:
  chromadb_data:
