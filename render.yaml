services:
  # 1. FastAPI Web Service
  - type: web
    name: shipordie-api
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free # Can be upgraded to starter or custom plans
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shipordie-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: shipordie-redis
          property: connectionString
      # Set your Groq API Key in Render Dashboard's Environment settings
      - key: GROQ_API_KEY
        sync: false
      # Razorpay Settings (Optional - leave blank if not used)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Cloudflare R2 Settings (Optional - if blank, defaults to local ./exports folder)
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

  # 2. Celery Background Worker
  - type: worker
    name: shipordie-worker
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    dockerCommand: celery -A backend.workers.celery_app worker --loglevel=info
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shipordie-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: shipordie-redis
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

  # 3. Redis Instance (Used for Celery task queuing)
  - type: redis
    name: shipordie-redis
    plan: free
    ipAllowList: [] # Restrict to internal connections only

# 4. Managed PostgreSQL Database
databases:
  - name: shipordie-db
    plan: free
